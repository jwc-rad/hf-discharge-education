# conda env create -f environment.yml && conda activate hf-edu
# Dependencies are installed with pip from requirements*.txt (conda + pip only; no uv/poetry).
name: hf-edu
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
      - -r requirements-dev.txt
      - -e .
